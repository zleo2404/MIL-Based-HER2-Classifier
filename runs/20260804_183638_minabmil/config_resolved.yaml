seed: 42
device: cuda
paths:
  base_dir: /scratch.hpc/leonardo.meloni/HER2
  wsi_dir: /scratch.hpc/sabrina.tassinari/ProgettoTesi/wsi_organizzate
  labels_csv: /scratch.hpc/sabrina.tassinari/ProgettoTesi/dataset/label_her2.csv
  runs_dir: /scratch.hpc/leonardo.meloni/HER2/runs
  features_dir: /scratch.hpc/leonardo.meloni/HER2/features
patching:
  level: 2
  patch_size: 1024
  tissue_ratio_threshold: 0.4
  artifact_ratio_threshold: 0.05
features:
  extractor_name: uni
labels:
  mapping:
    Negative: 1
    Positive: 0
model:
  name: minabmil
  num_classes: 1
optuna:
  n_trials: 50
  n_startup_trials: 5
  n_warmup_steps: 5
  threshold_trials: 20
  search_space:
    hidden_dim:
    - 64
    - 128
    learning_rate:
    - 1.0e-05
    - 0.01
    weight_decay:
    - 1.0e-05
    - 0.005
    dropout:
    - 0.2
    - 0.4
    loss_weight:
    - 0.1
    - 0.3
training:
  max_epochs: 50
  patience: 7
  val_size: 0.3
  test_size_of_val: 0.5
